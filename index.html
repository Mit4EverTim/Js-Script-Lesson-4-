<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="stylesheet" href="style.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="mb-1">My Phone Contact</h1>
        <p>Introduction to objects in Java Script </p>
        <div class="shadow-sm mb-3" style="max-width:400px;">
            <div class="card-body">
                <h5 class="card-title" style="color:blue">Contact details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">

                        <li class="list-group-item">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label d-block">Age</span>
                            <strong id="age">-</strong>
                        </li>

                        <li class="list-group-item">
                            <span class="card-label d-block">Email</span>
                            <strong id="email">-</strong>
                        </li>
                    </li>
                </ul>
            </div>
        </div>



    </div>
    <script src="script.js"></script>
</body>
</html>
